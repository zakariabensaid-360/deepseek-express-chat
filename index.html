<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Local Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col font-sans">

  <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold text-white tracking-wide">DeepSeek R1 Chat</h1>
    </div>
    <span class="text-xs bg-slate-700 text-slate-300 py-1 px-3 rounded-full font-mono">deepseek-r1:1.5b</span>
  </header>

  <main id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl w-full mx-auto">
    <div class="flex justify-start">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl rounded-tl-none p-4 max-w-[80%] text-slate-200 shadow-sm">
         I am running locally using <b>deepseek-r1:1.5b</b>. How can I help you today?
      </div>
    </div>
  </main>

  <!-- Input Form -->
  <footer class="p-4 bg-slate-800 border-t border-slate-700">
    <form id="chat-form" class="max-w-4xl mx-auto flex gap-3">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Type a message..." 
        required 
        autocomplete="off"
        class="flex-1 bg-slate-900 border border-slate-700 text-white placeholder-slate-400 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
      />
      <button 
        type="submit" 
        id="send-btn"
        class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-6 py-3 rounded-xl transition-all shadow-lg active:scale-95 disabled:opacity-50"
      >
        Send
      </button>
    </form>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text) {
      const isUser = role === 'user';
      const wrapperDiv = document.createElement('div');
      wrapperDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = isUser
        ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none p-4 max-w-[80%] shadow-md whitespace-pre-wrap'
        : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-2xl rounded-tl-none p-4 max-w-[80%] shadow-md whitespace-pre-wrap';

      bubbleDiv.textContent = text;
      wrapperDiv.appendChild(bubbleDiv);
      chatBox.appendChild(wrapperDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return bubbleDiv;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // Show temporary loading bubble
      const loadingBubble = appendMessage('assistant', 'Thinking...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });

        const data = await response.json();
        
        if (data.reply) {
          loadingBubble.textContent = data.reply;
        } else {
          loadingBubble.textContent = 'Error: ' + (data.error || 'No response returned');
        }
      } catch (err) {
        loadingBubble.textContent = 'Error: Failed to connect to server.';
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });
  </script>
</body>
</html>
